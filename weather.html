<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests; block-all-mixed-content">
<title>Météo · Parmain</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap');

  :root {
    --sky: #d6e8f7;
    --sky-deep: #8bb8d8;
    --ink: #1a2332;
    --ink-light: #3a4e63;
    --cloud: #f0f5fa;
    --sun: #f5a623;
    --rain: #5b8db8;
    --wind: #7ec8b4;
    --good: #4caf7d;
    --bad: #e07070;
    --panel: rgba(255,255,255,0.72);
    --border: rgba(26,35,50,0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--sky);
    color: var(--ink);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* Animated sky background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: linear-gradient(175deg, #c8dff2 0%, #dceefa 40%, #eef6ff 100%);
    z-index: 0;
  }

  /* Floating cloud shapes */
  .clouds {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 220px;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .cloud {
    position: absolute;
    background: rgba(255,255,255,0.55);
    border-radius: 50px;
    filter: blur(18px);
    animation: drift linear infinite;
  }
  .cloud:nth-child(1) { width: 280px; height: 80px; top: 30px; left: -100px; animation-duration: 60s; opacity: 0.7; }
  .cloud:nth-child(2) { width: 180px; height: 55px; top: 70px; left: 20%; animation-duration: 80s; animation-delay: -20s; opacity: 0.5; }
  .cloud:nth-child(3) { width: 350px; height: 90px; top: 15px; left: 50%; animation-duration: 100s; animation-delay: -40s; opacity: 0.4; }
  .cloud:nth-child(4) { width: 220px; height: 65px; top: 90px; right: 5%; animation-duration: 70s; animation-delay: -10s; opacity: 0.6; }

  @keyframes drift {
    from { transform: translateX(0); }
    to { transform: translateX(110vw); }
  }

  /* Layout */
  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 36px 20px 60px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 32px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .title-block h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.6rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1;
    color: var(--ink);
  }
  .title-block h1 em {
    font-style: italic;
    color: var(--rain);
  }
  .title-block .subtitle {
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    color: var(--ink-light);
    margin-top: 6px;
    text-transform: uppercase;
  }
  .refresh-btn {
    background: var(--ink);
    color: #fff;
    border: none;
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    padding: 8px 18px;
    border-radius: 4px;
    cursor: pointer;
    transition: opacity 0.2s;
    white-space: nowrap;
  }
  .refresh-btn:hover { opacity: 0.75; }
  .refresh-btn:disabled { opacity: 0.4; cursor: default; }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .city-input {
    background: rgba(255,255,255,0.65);
    border: 1px solid var(--border);
    color: var(--ink);
    border-radius: 6px;
    padding: 8px 10px;
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.03em;
    min-width: 180px;
  }

  .city-input:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .city-help {
    width: 100%;
    font-size: 0.66rem;
    color: var(--ink-light);
    opacity: 0.9;
    margin-top: -2px;
  }

  /* Current conditions panel */
  .current-panel {
    background: var(--panel);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 28px;
    margin-bottom: 24px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 20px;
    align-items: center;
  }
  .current-temp {
    font-family: 'Playfair Display', serif;
    font-size: 3.8rem;
    font-weight: 700;
    line-height: 1;
    color: var(--ink);
  }
  .current-temp sup { font-size: 1.4rem; vertical-align: super; }
  .current-details { display: flex; flex-direction: column; gap: 6px; }
  .current-condition {
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--ink);
  }
  .current-meta {
    font-size: 0.72rem;
    color: var(--ink-light);
    display: flex; flex-wrap: wrap; gap: 10px;
  }
  .current-meta span { display: flex; align-items: center; gap: 4px; }
  .sun-times {
    text-align: right;
    font-size: 0.72rem;
    color: var(--ink-light);
    line-height: 2;
  }
  .sun-times strong { color: var(--ink); font-size: 0.82rem; }

  .geo-panel {
    background: var(--panel);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 24px;
  }
  .geo-top {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 8px 14px;
    margin-bottom: 10px;
  }
  .geo-title {
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-light);
  }
  .geo-coords {
    font-size: 0.76rem;
    color: var(--ink);
    font-weight: 500;
  }
  .geo-map {
    width: 100%;
    height: 120px;
    border: 1px solid var(--border);
    border-radius: 10px;
  }

  /* Day tabs */
  .day-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .day-tab {
    background: rgba(255,255,255,0.5);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 16px;
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    cursor: pointer;
    color: var(--ink-light);
    transition: all 0.15s;
    letter-spacing: 0.04em;
  }
  .day-tab:hover { background: rgba(255,255,255,0.8); color: var(--ink); }
  .day-tab.active {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }

  /* Forecast table */
  .forecast-panel {
    background: var(--panel);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow-x: auto;
    overflow-y: hidden;
    margin-bottom: 24px;
    -webkit-overflow-scrolling: touch;
  }
  .forecast-header {
    display: grid;
    grid-template-columns: 52px 52px 56px 72px 80px 120px;
    padding: 10px 20px;
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-light);
    border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,0.4);
  }
  .forecast-row {
    display: grid;
    grid-template-columns: 52px 52px 56px 72px 80px 120px;
    padding: 9px 20px;
    align-items: center;
    border-bottom: 1px solid var(--border);
    font-size: 0.78rem;
    transition: background 0.15s;
  }
  .forecast-row:last-child { border-bottom: none; }
  .forecast-row:hover { background: rgba(255,255,255,0.5); }
  .forecast-row.good { border-left: 3px solid var(--good); }
  .forecast-row.moderate { border-left: 3px solid var(--sun); }

  .time-col { font-weight: 500; color: var(--ink); }
  .cloud-pct { font-size: 0.78rem; color: var(--ink-light); }
  .temp-col { font-weight: 500; }
  .wind-col { color: var(--ink-light); }
  .rain-col { color: var(--rain); overflow: hidden; }
  .precip-col { color: var(--rain); }
  .cell-stack {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 1px;
    line-height: 1.2;
    min-width: 0;
  }
  .cell-icon { font-size: 0.9rem; line-height: 1; }
  .cell-sub {
    font-size: 0.6rem;
    color: var(--ink-light);
    line-height: 1;
    white-space: nowrap;
  }
  .check-col {
    text-align: left;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 4px;
    flex-wrap: nowrap;
    min-height: 20px;
    min-width: 0;
    overflow: hidden;
  }
  .good-mark {
    color: var(--good);
    font-size: 1rem;
    font-weight: 700;
  }
  .fail-tags {
    display: inline-flex;
    gap: 5px;
    flex-wrap: nowrap;
    justify-content: flex-start;
    overflow-x: auto;
    overflow-y: hidden;
    max-width: 100%;
  }
  .fail-tag {
    font-size: 0.58rem;
    line-height: 1;
    padding: 3px 5px;
    border-radius: 6px;
    color: #9a2f2f;
    background: rgba(220, 72, 72, 0.12);
    border: 1px solid rgba(220, 72, 72, 0.35);
    letter-spacing: 0.03em;
    cursor: help;
    min-width: 22px;
    text-align: center;
    white-space: nowrap;
  }
  .fail-tag-single {
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .estimate-tag {
    display: inline-block;
    margin-left: 6px;
    font-size: 0.56rem;
    line-height: 1;
    padding: 2px 5px;
    border-radius: 999px;
    color: #224d8f;
    background: rgba(71, 122, 199, 0.12);
    border: 1px solid rgba(71, 122, 199, 0.35);
    letter-spacing: 0.03em;
    vertical-align: middle;
    cursor: help;
  }
  .criteria-legend {
    font-size: 0.62rem;
    color: var(--ink-light);
    padding: 8px 12px;
    margin-top: 8px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    background: rgba(255,255,255,0.35);
    letter-spacing: 0.03em;
  }

  .multi-hour-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 10px;
  }
  .multi-hour-block {
    border: 1px solid var(--border);
    border-radius: 10px;
    background: rgba(255,255,255,0.45);
    padding: 10px;
  }
  .multi-hour-title {
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .reliability-badge {
    font-size: 0.62rem;
    letter-spacing: 0.03em;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .reliability-high {
    color: #1f6f66;
    border-color: rgba(45, 150, 137, 0.45);
    background: rgba(45, 150, 137, 0.16);
  }
  .reliability-medium {
    color: #8a5f1d;
    border-color: rgba(204, 138, 46, 0.45);
    background: rgba(204, 138, 46, 0.16);
  }
  .reliability-low {
    color: #8e3054;
    border-color: rgba(197, 85, 123, 0.45);
    background: rgba(197, 85, 123, 0.16);
  }
  .reliability-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }
  .multi-model-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 8px;
  }
  .multi-model-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: rgba(255,255,255,0.6);
    padding: 8px;
    font-size: 0.7rem;
    line-height: 1.5;
  }
  .multi-model-card.unavailable {
    opacity: 0.6;
  }
  .model-badge {
    display: inline-block;
    border-radius: 999px;
    padding: 2px 8px;
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
    border: 1px solid transparent;
  }
  .model-icon { background: rgba(71, 122, 199, 0.16); border-color: rgba(71, 122, 199, 0.45); color: #224d8f; }
  .model-meteofrance { background: rgba(45, 150, 137, 0.16); border-color: rgba(45, 150, 137, 0.45); color: #1f6f66; }
  .model-icond2 { background: rgba(204, 138, 46, 0.16); border-color: rgba(204, 138, 46, 0.45); color: #8a5f1d; }
  .model-knmi { background: rgba(197, 85, 123, 0.16); border-color: rgba(197, 85, 123, 0.45); color: #8e3054; }
  .model-dmi { background: rgba(70, 117, 154, 0.16); border-color: rgba(70, 117, 154, 0.45); color: #2a536f; }
  .model-rsukmo { background: rgba(134, 95, 172, 0.16); border-color: rgba(134, 95, 172, 0.45); color: #5f3f82; }
  .model-stat { white-space: nowrap; }

  /* Best windows */
  .windows-panel {
    background: var(--panel);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 24px;
    margin-bottom: 24px;
  }
  .windows-title {
    font-size: 0.65rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-light);
    margin-bottom: 14px;
  }
  .window-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: rgba(76,175,125,0.1);
    border: 1px solid rgba(76,175,125,0.25);
    border-radius: 8px;
    margin-bottom: 8px;
    font-size: 0.78rem;
  }
  .window-item:last-child { margin-bottom: 0; }
  .window-icon { font-size: 1.1rem; }
  .window-time { font-weight: 500; color: var(--ink); min-width: 110px; }
  .window-main {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    min-width: 170px;
  }
  .window-info { color: var(--ink-light); font-size: 0.72rem; }
  .no-windows {
    font-size: 0.8rem;
    color: var(--ink-light);
    font-style: italic;
    padding: 8px 0;
  }

  /* Status / loading */
  .status {
    text-align: center;
    padding: 48px 20px;
    font-size: 0.82rem;
    color: var(--ink-light);
  }
  .spinner {
    display: inline-block;
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--ink);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-msg {
    background: rgba(224,112,112,0.1);
    border: 1px solid rgba(224,112,112,0.3);
    border-radius: 10px;
    padding: 16px 20px;
    font-size: 0.8rem;
    color: #c04040;
    margin-bottom: 20px;
  }

  /* Activity selector */
  .activity-selector {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .activity-btn {
    background: rgba(255,255,255,0.5);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 7px 16px;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    cursor: pointer;
    color: var(--ink-light);
    transition: all 0.15s;
    letter-spacing: 0.03em;
  }
  .activity-btn:hover { background: rgba(255,255,255,0.8); color: var(--ink); }
  .activity-btn.active {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }

  /* Footer */
  .footer {
    font-size: 0.65rem;
    color: var(--ink-light);
    opacity: 0.6;
    text-align: center;
    letter-spacing: 0.06em;
    margin-top: 12px;
  }

  @media (max-width: 600px) {
    .title-block h1 { font-size: 2rem; }
    .current-panel { grid-template-columns: auto 1fr; }
    .sun-times { display: none; }
    .header-controls {
      width: 100%;
      justify-content: flex-start;
    }
    .forecast-header, .forecast-row { padding: 8px 10px; font-size: 0.68rem; }
    .forecast-row { font-size: 0.73rem; }
    .forecast-header, .forecast-row { grid-template-columns: 44px 44px 48px 56px 74px 124px; }
    .cell-icon { font-size: 0.82rem; }
    .cell-sub { font-size: 0.56rem; }
    .check-col { font-size: 0.68rem; }
    .fail-tag { font-size: 0.52rem; padding: 2px 3px; }
  }
</style>
</head>
<body>
<div class="clouds">
  <div class="cloud"></div>
  <div class="cloud"></div>
  <div class="cloud"></div>
  <div class="cloud"></div>
</div>

<div class="wrapper">
  <div class="header">
    <div class="title-block">
      <h1>Météo <em id="cityTitle">Parmain</em></h1>
      <div class="subtitle"><span id="subtitleLocation">Val-d'Oise · Île-de-France</span> · Prévisions outdoor</div>
    </div>
    <div class="header-controls">
      <input class="city-input" id="cityInput" type="text" value="Parmain" placeholder="Tape une ville" list="citySuggestions" onkeydown="if(event.key==='Enter'){searchCity();}" onchange="onCityInputChange()">
      <select class="city-input" id="climbingSiteSelect" style="display:none" onchange="selectClimbingSite(this.value)"></select>
      <datalist id="citySuggestions"></datalist>
      <select class="city-input" id="modelModeSelect" onchange="selectForecastMode(this.value)">
        <option value="icon">Modele: ICON-EU</option>
        <option value="arome">Modele: meteo france</option>
        <option value="meteo_concept">Modele: Meteo Concept</option>
        <option value="icon_d2" selected>Modele: ICON-D2</option>
        <option value="knmi">Modele: KNMI Seamless</option>
        <option value="dmi">Modele: DMI Seamless</option>
        <option value="rsukmo">Modele: RS-UKMO Seamless</option>
        <option value="multi">Modele: Multimodel</option>
      </select>
      <button class="refresh-btn" id="citySearchBtn" onclick="searchCity()">Chercher</button>
      <button class="refresh-btn" id="refreshBtn" onclick="loadWeather()">↻ Actualiser</button>
      <div class="city-help" id="cityHelp"></div>
      <div class="city-help" id="modelHelp"></div>
    </div>
  </div>

  <div id="app">
    <div class="status"><div class="spinner"></div><br>Chargement des données météo…</div>
  </div>

  <div class="footer">Source : Open-Meteo / Meteo-Concept · Modèle <span id="modelSourceLabel">ICON-D2</span> · Mise à jour toutes les heures</div>
</div>

<script>
const DEFAULT_CITY = {
  name: 'Parmain',
  label: 'Parmain, 95620',
  subtitle: "Val-d'Oise · Île-de-France",
  lat: 49.1317,
  lon: 2.0607,
  timezone: 'Europe/Paris',
  countryCode: 'FR'
};

const CLIMBING_SITES = {
  saint_maximin_le_larris: {
    name: 'Saint Maximin Le Larris',
    label: 'Saint Maximin Le Larris',
    subtitle: 'Site Escalade · Oise · Hauts-de-France',
    lat: 49.216,
    lon: 2.445,
    timezone: 'Europe/Paris',
    countryCode: 'FR',
    aliases: ['saint maximin le larris', 'saint maximim le larris', 'larris', 'saint maximin', 'saint maximim']
  },
  st_vaast_les_melo: {
    name: 'St Vaast Les Melo',
    label: 'St Vaast Les Melo',
    subtitle: 'Site Escalade · Oise · Hauts-de-France',
    lat: 49.271,
    lon: 2.392,
    timezone: 'Europe/Paris',
    countryCode: 'FR',
    aliases: ['st vaast les melo', 'st vaast les mello', 'saint vaast les melo', 'saint vaast les mello', 'vaast']
  },
  les_andelys: {
    name: 'Les Andelys',
    label: 'Les Andelys',
    subtitle: 'Site Escalade · Eure · Normandie',
    lat: 49.247,
    lon: 1.411,
    timezone: 'Europe/Paris',
    countryCode: 'FR',
    aliases: ['les andelys', 'andelys']
  }
};

const ACTIVITIES = {
  running: {
    label: '🏃 Course',
    cloud: 60, rain: 30, precip: 2.0, wind: 30, tempMin: 0, tempMax: 32,
    tips: 'Vent critique >30 km/h · Chaleur >30°C déconseillée · Pluie ≤2 mm/h'
  },
  cycling: {
    label: '🚴 Vélo',
    cloud: 60, rain: 15, precip: 0.5, wind: 25, tempMin: 5, tempMax: 35,
    tips: 'Vent critique >25 km/h · Pluie dangereuse (freinage) · Cumul ≤0.5 mm/h'
  },
  climbing: {
    label: '🧗 Escalade',
    cloud: 40, rain: 20, wind: 40, tempMin: 5, tempMax: 35,
    tips: 'Roche sèche requise · Pluie 24h = 0 mm · Cumul 72h < 2 mm · Quantité brute < 1.0 mm · Pluie espérée (prob×mm) < 0.10 mm · Écart Tair–Trosée > 3°C (condensation) · Humidité < 85% · Évapotranspiration > 0 · Vent > 15 km/h'
  }
};

let currentActivity = 'running';

function getThresholds() { return ACTIVITIES[currentActivity]; }

const WEATHER_CODES = {

function normalizeText(value) {
  return (value || '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9 ]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function findClimbingSite(query) {
  const q = normalizeText(query);
  if (!q) return null;
  return Object.values(CLIMBING_SITES).find(site =>
    site.aliases.some(alias => {
      const a = normalizeText(alias);
      return a === q || q.includes(a) || a.includes(q);
    })
  ) || null;
}

function buildWeatherUrl(city, model) {
  return `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}` +
    `&hourly=temperature_2m,cloudcover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,windspeed_10m,precipitation_probability,precipitation,dew_point_2m,relative_humidity_2m,et0_fao_evapotranspiration,weathercode` +
    `&daily=weathercode,temperature_2m_max,temperature_2m_min,sunrise,sunset` +
    `&current_weather=true&timezone=${encodeURIComponent(city.timezone)}&forecast_days=3&past_days=3` +
    `&models=${encodeURIComponent(model)}`;
}

function buildMeteoConceptUrl(path, city, extraParams = {}) {
  const params = new URLSearchParams({
    token: METEO_CONCEPT_API_KEY,
    latlng: `${city.lat},${city.lon}`,
    ...extraParams
  });
  return `https://api.meteo-concept.com${path}?${params.toString()}`;
}

function toIsoLocalHour(datetimeValue) {
  const d = new Date(datetimeValue);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:00`;
}

function mapMeteoConceptCodeToWmo(code) {
  const c = Number(code);
  if (!Number.isFinite(c)) return 3;
  if (c === 0) return 0;
  if (c <= 2) return 1;
  if (c <= 4) return 2;
  if (c <= 7) return 3;
  if (c >= 200) return 65;
  if (c >= 100) return 61;
  if (c >= 80) return 95;
  if (c >= 40) return 80;
  if (c >= 20) return 51;
  if (c >= 10) return 45;
  return 3;
}

function estimateCloudCoverFromMeteoConcept(code) {
  const c = Number(code);
  if (!Number.isFinite(c)) return 70;
  if (c === 0) return 5;
  if (c <= 2) return 25;
  if (c <= 4) return 45;
  if (c <= 7) return 80;
  if (c >= 10) return 95;
  return 70;
}

function computeDewPointC(tempC, humidityPct) {
  const t = Number(tempC);
  const rh = Number(humidityPct);
  if (!Number.isFinite(t) || !Number.isFinite(rh) || rh <= 0) return t;
  const a = 17.27;
  const b = 237.7;
  const alpha = ((a * t) / (b + t)) + Math.log(rh / 100);
  return (b * alpha) / (a - alpha);
}

async function fetchMeteoConceptDataset(city) {
  const hourlyUrl = buildMeteoConceptUrl('/api/forecast/nextHours', city, { hourly: 'true' });
  const dailyUrl = buildMeteoConceptUrl('/api/forecast/daily', city);
  const sunUrl = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}` +
    `&daily=sunrise,sunset&timezone=${encodeURIComponent(city.timezone)}&forecast_days=14`;

  const [hourlyRes, dailyRes, sunRes] = await Promise.all([
    fetch(hourlyUrl),
    fetch(dailyUrl),
    fetch(sunUrl)
  ]);

  if (!hourlyRes.ok) throw new Error(`Meteo Concept nextHours HTTP ${hourlyRes.status}`);
  if (!dailyRes.ok) throw new Error(`Meteo Concept daily HTTP ${dailyRes.status}`);
  if (!sunRes.ok) throw new Error(`Open-Meteo sunrise/sunset HTTP ${sunRes.status}`);

  const hourlyJson = await hourlyRes.json();
  const dailyJson = await dailyRes.json();
  const sunJson = await sunRes.json();

  const hourlyForecast = Array.isArray(hourlyJson.forecast) ? hourlyJson.forecast : [];
  const dailyForecast = Array.isArray(dailyJson.forecast) ? dailyJson.forecast : [];

  const daily = {
    time: dailyForecast.map(d => toIsoLocalHour(d.datetime).slice(0, 10)),
    weathercode: dailyForecast.map(d => mapMeteoConceptCodeToWmo(d.weather)),
    temperature_2m_max: dailyForecast.map(d => Number.isFinite(d.tmax) ? d.tmax : null),
    temperature_2m_min: dailyForecast.map(d => Number.isFinite(d.tmin) ? d.tmin : null),
    sunrise: Array.isArray(sunJson?.daily?.sunrise) ? sunJson.daily.sunrise.slice(0, dailyForecast.length) : [],
    sunset: Array.isArray(sunJson?.daily?.sunset) ? sunJson.daily.sunset.slice(0, dailyForecast.length) : []
  };

  const hourlyRecords = hourlyForecast.map(h => {
    const temp = Number.isFinite(h.temp2m) ? h.temp2m : null;
    const humidity = Number.isFinite(h.rh2m) ? h.rh2m : null;
    return {
      time: toIsoLocalHour(h.datetime),
      temperature_2m: temp,
      cloudcover: estimateCloudCoverFromMeteoConcept(h.weather),
      windspeed_10m: Number.isFinite(h.wind10m) ? h.wind10m : null,
      precipitation_probability: Number.isFinite(h.probarain) ? h.probarain : null,
      precipitation: Number.isFinite(h.rr1) ? h.rr1 : (Number.isFinite(h.rr10) ? h.rr10 : null),
      relative_humidity_2m: humidity,
      dew_point_2m: computeDewPointC(temp, humidity),
      et0_fao_evapotranspiration: 0,
      weathercode: mapMeteoConceptCodeToWmo(h.weather),
      estimated: false
    };
  });

  const presentDays = new Set(hourlyRecords.map(h => h.time.slice(0, 10)));
  const fallbackSlots = [8, 11, 14, 17];
  dailyForecast.slice(0, 4).forEach((d, idx) => {
    const day = daily.time[idx];
    if (!day || presentDays.has(day)) return;

    const tMin = Number.isFinite(d.tmin) ? d.tmin : 0;
    const tMax = Number.isFinite(d.tmax) ? d.tmax : tMin;
    const tempSpread = Math.max(0, tMax - tMin);
    const factors = [0.35, 0.6, 0.9, 0.7];
    const defaultHumidity = 78;
    const precipBySlot = Number.isFinite(d.rr10) ? d.rr10 / fallbackSlots.length : 0;
    const et0BySlot = Number.isFinite(d.etp) ? d.etp / fallbackSlots.length : 0;

    fallbackSlots.forEach((hour, slotIndex) => {
      const hh = String(hour).padStart(2, '0');
      const time = `${day}T${hh}:00`;
      const temp = Number((tMin + tempSpread * factors[slotIndex]).toFixed(1));
      const humidity = defaultHumidity;
      hourlyRecords.push({
        time,
        temperature_2m: temp,
        cloudcover: estimateCloudCoverFromMeteoConcept(d.weather),
        windspeed_10m: Number.isFinite(d.wind10m) ? d.wind10m : 0,
        precipitation_probability: Number.isFinite(d.probarain) ? d.probarain : 0,
        precipitation: Number(precipBySlot.toFixed(2)),
        relative_humidity_2m: humidity,
        dew_point_2m: computeDewPointC(temp, humidity),
        et0_fao_evapotranspiration: Number(et0BySlot.toFixed(2)),
        weathercode: mapMeteoConceptCodeToWmo(d.weather),
        estimated: true
      });
    });
  });

  hourlyRecords.sort((a, b) => a.time.localeCompare(b.time));

  const hourly = {
    time: hourlyRecords.map(h => h.time),
    temperature_2m: hourlyRecords.map(h => h.temperature_2m),
    cloudcover: hourlyRecords.map(h => h.cloudcover),
    windspeed_10m: hourlyRecords.map(h => h.windspeed_10m),
    precipitation_probability: hourlyRecords.map(h => h.precipitation_probability),
    precipitation: hourlyRecords.map(h => h.precipitation),
    relative_humidity_2m: hourlyRecords.map(h => h.relative_humidity_2m),
    dew_point_2m: hourlyRecords.map(h => h.dew_point_2m),
    et0_fao_evapotranspiration: hourlyRecords.map(h => h.et0_fao_evapotranspiration),
    weathercode: hourlyRecords.map(h => h.weathercode),
    estimated: hourlyRecords.map(h => Boolean(h.estimated))
  };

  const now = new Date();
  const nearestHourly = hourlyRecords
    .map(h => ({
      src: h,
      diff: Math.abs(new Date(h.time).getTime() - now.getTime())
    }))
    .sort((a, b) => a.diff - b.diff)[0]?.src;

  const current_weather = nearestHourly ? {
    temperature: Number.isFinite(nearestHourly.temperature_2m) ? nearestHourly.temperature_2m : 0,
    windspeed: Number.isFinite(nearestHourly.windspeed_10m) ? nearestHourly.windspeed_10m : 0,
    weathercode: Number.isFinite(nearestHourly.weathercode) ? nearestHourly.weathercode : 3
  } : {
    temperature: 0,
    windspeed: 0,
    weathercode: 3
  };

  return {
    latitude: city.lat,
    longitude: city.lon,
    timezone: city.timezone,
    hourly,
    daily,
    current_weather
  };
}

function isAromeCoverage(city) {
  const cc = (city.countryCode || '').toUpperCase();
  if (cc !== 'FR') return false;
  return city.lat >= 41.0 && city.lat <= 51.5 && city.lon >= -5.8 && city.lon <= 10.0;
}

function isIconD2Coverage(city) {
  const cc = (city.countryCode || '').toUpperCase();
  if (['DE', 'FR', 'BE', 'NL', 'LU', 'CH', 'AT', 'CZ', 'PL', 'DK'].includes(cc)) return true;
  return city.lat >= 44.0 && city.lat <= 57.5 && city.lon >= -1.5 && city.lon <= 19.5;
}

function isKnmiCoverage(city) {
  const cc = (city.countryCode || '').toUpperCase();
  if (['NL', 'BE', 'LU', 'DE', 'FR', 'GB', 'DK'].includes(cc)) return true;
  return city.lat >= 45.0 && city.lat <= 58.5 && city.lon >= -8.5 && city.lon <= 13.5;
}

function isDmiCoverage(city) {
  const cc = (city.countryCode || '').toUpperCase();
  if (['DK', 'NO', 'SE', 'FI', 'DE', 'NL', 'GB', 'FR', 'BE', 'IE'].includes(cc)) return true;
  return city.lat >= 45.0 && city.lat <= 72.0 && city.lon >= -20.0 && city.lon <= 35.0;

function isRsukmoCoverage(city) {
  const cc = (city.countryCode || '').toUpperCase();
  if (['GB', 'IE', 'FR', 'BE', 'NL', 'DE', 'DK', 'NO'].includes(cc)) return true;
  return city.lat >= 45.0 && city.lat <= 64.0 && city.lon >= -16.0 && city.lon <= 20.0;
}

      FORECAST_MODES.knmi,
      FORECAST_MODES.dmi,
      FORECAST_MODES.rsukmo
    ];
    const coverageText = modelModes
      .map(mode => {
        const mc = MODEL_CATALOG[mode];
        const ok = mc.coverageCheck ? mc.coverageCheck(city) : true;
        const precisionText = mc.geoPrecision ? ` · precision ${mc.geoPrecision}` : '';
        return `${mc.label}: ${ok ? 'OK' : 'hors zone'}${precisionText}`;
      })
      .join(' · ');

  }
  const inCoverage = cfg.coverageCheck ? cfg.coverageCheck(city) : true;

  el.textContent = `Modele ${cfg.label} · Nationalite: ${cfg.nationality} · Couverture: ${cfg.coverage}${precisionText} · Prevision: ${cfg.horizon}${inCoverage ? '' : ' · Hors couverture pour cette ville'}`;
}

function normalizeWeatherDataset(data) {
  if (!data || !data.hourly) return data;

  const timeArr = Array.isArray(data.hourly.time) ? data.hourly.time : [];

  const existingTotal = Array.isArray(data.hourly.cloudcover)
    ? data.hourly.cloudcover.slice()
    : (Array.isArray(data.hourly.cloud_cover) ? data.hourly.cloud_cover.slice() : []);

  data.hourly.cloudcover = timeArr.map((_, i) => {
    const total = existingTotal[i];
    return Number.isFinite(total) ? total : null;
  });

  return data;
}

async function loadWeather() {
  const btn = document.getElementById('refreshBtn');
  const cityInput = document.getElementById('cityInput');
  const citySearchBtn = document.getElementById('citySearchBtn');
  const city = getSelectedCity();

  btn.disabled = true;
  if (cityInput) cityInput.disabled = true;
  if (citySearchBtn) citySearchBtn.disabled = true;
  btn.textContent = '…';

  const cfg = getSelectedModelConfig();
  const modelUrl = cfg.apiModel ? buildWeatherUrl(city, cfg.apiModel) : null;
  const inCoverage = cfg.coverageCheck ? cfg.coverageCheck(city) : true;

  try {
    if (selectedForecastMode === FORECAST_MODES.multi) {
      const modelModes = [
        FORECAST_MODES.icon,
        FORECAST_MODES.arome,
        FORECAST_MODES.icon_d2,
        FORECAST_MODES.knmi,
        FORECAST_MODES.dmi,
        FORECAST_MODES.rsukmo
      ];
      const eligible = modelModes
        .map(mode => ({ mode, cfg: MODEL_CATALOG[mode] }))
        .filter(item => (item.cfg.coverageCheck ? item.cfg.coverageCheck(city) : true));

      if (!eligible.length) throw new Error('Aucun modele disponible pour cette ville');

      const responses = await Promise.all(eligible.map(async item => {
        const url = buildWeatherUrl(city, item.cfg.apiModel);
        const res = await fetch(url);
        if (!res.ok) throw new Error(`${item.cfg.label} HTTP ${res.status}`);
        const json = await res.json();
        return {
          mode: item.mode,
          label: item.cfg.label,
          data: normalizeWeatherDataset(json)
        };
      }));

      multiWeatherData = responses;
      weatherData = responses[0].data;
      weatherSourceLabel = `Multimodel (${responses.map(r => r.label).join(', ')})`;
      updateModelSourceLabel();
    } else {
        if (!inCoverage) throw new Error(`${cfg.label} hors zone de couverture pour cette ville`);
        if (cfg.provider === 'meteoConcept') {
          weatherData = normalizeWeatherDataset(await fetchMeteoConceptDataset(city));
        } else {
          const modelRes = await fetch(modelUrl);
          if (!modelRes.ok) throw new Error(`${cfg.label} HTTP ${modelRes.status}`);
          weatherData = normalizeWeatherDataset(await modelRes.json());
        }
      multiWeatherData = null;
      weatherSourceLabel = `${cfg.label} (mode manuel)`;
      updateModelSourceLabel();
    }

    const todayStr = new Date().toISOString().slice(0, 10);
    selectedDay = Math.max(0, weatherData.daily.time.findIndex(t => t >= todayStr));
    render();
  } catch (e) {
    multiWeatherData = null;
    weatherSourceLabel = 'Erreur chargement';
    updateModelSourceLabel();
    document.getElementById('app').innerHTML = `
      <div class="error-msg">⚠️ Impossible de charger les données météo.<br>
      Vérifiez votre connexion et réessayez.<br><small>${e.message}</small></div>`;
  }

  btn.disabled = false;
  if (cityInput) cityInput.disabled = false;
  if (citySearchBtn) citySearchBtn.disabled = false;
  btn.textContent = '↻ Actualiser';
}

async function searchCity() {
  const cityInput = document.getElementById('cityInput');
  const citySearchBtn = document.getElementById('citySearchBtn');
  const climbingSiteSelect = document.getElementById('climbingSiteSelect');
  if (!cityInput || !citySearchBtn) return;

  if (currentActivity === 'climbing') {
    if (climbingSiteSelect && climbingSiteSelect.value) {
      selectClimbingSite(climbingSiteSelect.value);
    }
    return;
  }

  const query = cityInput.value.trim();
  if (!query) return;

  citySearchBtn.disabled = true;
  citySearchBtn.textContent = '…';

  try {
    if (currentActivity === 'climbing') {
      const climbingSite = findClimbingSite(query);
      if (!climbingSite) {
        throw new Error('Pour Escalade, choisis Saint Maximin Le Larris ou St Vaast Les Melo');
      }

      currentCity = {
        name: climbingSite.name,
        label: climbingSite.label,
        subtitle: climbingSite.subtitle,
        lat: climbingSite.lat,
        lon: climbingSite.lon,
        timezone: climbingSite.timezone,
        countryCode: climbingSite.countryCode || 'FR'
      };

      cityInput.value = currentCity.name;
      updateCityLabels();
      await loadWeather();
      citySearchBtn.disabled = false;
      citySearchBtn.textContent = 'Chercher';
      return;
    }

    const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=fr&format=json`;
    const res = await fetch(geoUrl);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const data = await res.json();
    if (!data.results || !data.results.length) {
      throw new Error('Ville introuvable');
    }

    const result = data.results[0];
    const region = result.admin1 || result.admin2 || result.country || '';

    currentCity = {
      name: result.name || query,
      label: result.postcode ? `${result.name}, ${result.postcode}` : `${result.name}, ${result.country_code || result.country || ''}`,
      subtitle: [region, result.country].filter(Boolean).join(' · '),
      lat: result.latitude,
      lon: result.longitude,
      timezone: result.timezone || 'Europe/Paris',
      countryCode: (result.country_code || 'FR').toUpperCase()
    };

    cityInput.value = currentCity.name;
    updateCityLabels();
    await loadWeather();
  } catch (e) {
    document.getElementById('app').innerHTML = `
      <div class="error-msg">⚠️ Impossible de trouver la ville « ${query} ».<br>
      Vérifiez l'orthographe et réessayez.<br><small>${e.message}</small></div>`;
  }

  citySearchBtn.disabled = false;
  citySearchBtn.textContent = 'Chercher';
}

function formatTime(isoStr) {
  return isoStr.slice(11, 16);
}

function formatWindowEndTime(isoStr, hoursToAdd = 1) {
  const d = new Date(isoStr);
  d.setHours(d.getHours() + hoursToAdd);
  return d.toLocaleTimeString('fr-FR', {
    hour: '2-digit',
    minute: '2-digit',
    hour12: false
  });
}

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
}

function formatCoord(value, positiveDir, negativeDir) {
  const abs = Math.abs(value).toFixed(4);
  const dir = value >= 0 ? positiveDir : negativeDir;
  return `${abs}° ${dir}`;
}

function getCountryBounds(countryCode, lat, lon) {
  const bounds = {
    FR: { left: -5.5, bottom: 41.0, right: 9.8, top: 51.4 },
    BE: { left: 2.4, bottom: 49.4, right: 6.5, top: 51.6 },
    CH: { left: 5.9, bottom: 45.7, right: 10.6, top: 47.9 },
    DE: { left: 5.8, bottom: 47.2, right: 15.2, top: 55.1 },
    ES: { left: -9.8, bottom: 35.9, right: 4.6, top: 43.9 },
    IT: { left: 6.6, bottom: 36.5, right: 18.6, top: 47.2 },
    GB: { left: -8.8, bottom: 49.8, right: 1.9, top: 58.8 }
  };

  if (bounds[countryCode]) return bounds[countryCode];

  const delta = 6;
  return {
    left: lon - delta,
    bottom: lat - delta,
    right: lon + delta,
    top: lat + delta
  };
}

function getMapUrl(city) {
  const b = getCountryBounds((city.countryCode || '').toUpperCase(), city.lat, city.lon);
  const marker = `${city.lat.toFixed(5)}%2C${city.lon.toFixed(5)}`;
  return `https://www.openstreetmap.org/export/embed.html?bbox=${b.left}%2C${b.bottom}%2C${b.right}%2C${b.top}&layer=mapnik&marker=${marker}`;
}

function getHourlyForDay(dayIndex) {
  return getHourlyForDayFromData(weatherData, dayIndex);
}

function getHourlyForDayFromData(dataset, dayIndex) {
  if (!dataset || !dataset.daily || !dataset.hourly) return [];
  const date = dataset.daily.time[dayIndex];
  const sunrise = new Date(dataset.daily.sunrise[dayIndex]);
  const sunset = new Date(dataset.daily.sunset[dayIndex]);
  const asNumber = (v, fallback = 0) => (Number.isFinite(v) ? v : fallback);
  const asOptionalNumber = v => (Number.isFinite(v) ? v : null);

  return dataset.hourly.time
    .map((t, i) => ({
      time: t,
      temp: asOptionalNumber(dataset.hourly.temperature_2m[i]),
      cloud: asOptionalNumber(dataset.hourly.cloudcover[i]),
      wind: asOptionalNumber(dataset.hourly.windspeed_10m[i]),
      // Some models (e.g. ICON-D2) do not provide precipitation probability.
      rain: asOptionalNumber(dataset.hourly.precipitation_probability[i]),
      precip: asOptionalNumber(dataset.hourly.precipitation[i]),
      dewPoint: asOptionalNumber(dataset.hourly.dew_point_2m[i]),
      humidity: asOptionalNumber(dataset.hourly.relative_humidity_2m[i]),
      et0: asOptionalNumber(dataset.hourly.et0_fao_evapotranspiration[i]),
      code: dataset.hourly.weathercode[i],
      estimated: Array.isArray(dataset.hourly.estimated) ? Boolean(dataset.hourly.estimated[i]) : false,
      rawIndex: i,
    }))
    .filter(h => {
      const hDate = h.time.slice(0, 10);
      if (hDate !== date) return false;
      const hHour = new Date(h.time);
      return hHour >= new Date(sunrise.getTime() - 30 * 60000) &&
             hHour <= new Date(sunset.getTime() + 30 * 60000);
    });
}

function getRollingPrecip(rawIndex, hoursBack) {
  if (!weatherData || !weatherData.hourly || !weatherData.hourly.precipitation) return 0;
  const arr = weatherData.hourly.precipitation;
  let sum = 0;
  const start = Math.max(0, rawIndex - hoursBack + 1);
  for (let i = start; i <= rawIndex; i += 1) {
    sum += arr[i] || 0;
  }
  return sum;
}

function getClimbingDrynessMetrics(h) {
  const precip24 = getRollingPrecip(h.rawIndex, 24);
  const precip72 = getRollingPrecip(h.rawIndex, 72);
  const dewGap = h.temp - (h.dewPoint || h.temp);
  const condensationRisk = dewGap < 1 && (h.humidity || 0) > 85;
  const rawPrecip = h.precip || 0;
  const rainProb = h.rain || 0;
  const expectedPrecip = (rainProb / 100) * rawPrecip;

  return {
    precip24,
    precip72,
    dewGap,
    condensationRisk,
    humidity: h.humidity || 0,
    wind: h.wind || 0,
    et0: h.et0 || 0,
    rainProb,
    rawPrecip,
    expectedPrecip
  };
}

function isDryRockHour(h) {
  const m = getClimbingDrynessMetrics(h);
  return m.precip24 === 0
    && m.precip72 < 2
    && m.rainProb < 20
    && m.rawPrecip < 1.0
    && m.expectedPrecip < 0.1
    && m.dewGap > 3
    && !m.condensationRisk
    && m.humidity < 85
    && m.et0 > 0
    && m.wind > 15;
}

function getRainDecision(h) {
  if (Number.isFinite(h.rain)) {
    return { value: h.rain, fallback: false };
  }
  if (Number.isFinite(h.precip)) {
    return { value: h.precip > 0 ? 100 : 0, fallback: true };
  }
  return { value: null, fallback: false };
}

function isGoodHour(h) {
  const t = getThresholds();
  const rainDecision = getRainDecision(h);
  const rainForDecision = rainDecision.value;
  const hasCore = Number.isFinite(h.cloud)
    && Number.isFinite(h.wind)
    && Number.isFinite(h.temp)
    && Number.isFinite(rainForDecision)
    && Number.isFinite(h.precip);
  if (!hasCore) return false;

  const precipOk = t.precip == null || h.precip <= t.precip;
  const baseOk = h.cloud <= t.cloud && rainForDecision <= t.rain && h.wind <= t.wind
    && h.temp >= t.tempMin && h.temp <= t.tempMax && precipOk;

  if (currentActivity === 'climbing') {
    return baseOk && isDryRockHour(h);
  }

  return baseOk;
}

function getBestWindows(hours) {
  const windows = [];
  let start = null;
  const minWindowHours = currentActivity === 'running' ? 1 : 2;
  hours.forEach((h, i) => {
    const good = isGoodHour(h);
    if (good && start === null) start = i;
    if (!good && start !== null) {
      if (i - start >= minWindowHours) windows.push({ start, end: i - 1, hours });
      start = null;
    }
  });
  if (start !== null && hours.length - start >= minWindowHours)
    windows.push({ start, end: hours.length - 1, hours });
  return windows;
}

function cloudEmoji(pct) {
  if (pct <= 10) return '☀️';
  if (pct <= 30) return '🌤️';
  if (pct <= 60) return '⛅';
  if (pct <= 85) return '🌥️';
  return '☁️';
}

function rainEmoji(prob, mm) {
  if (prob < 10 && mm < 0.1) return '·';
  if (prob < 30 || mm < 0.5) return '🌂';
  if (prob < 60 || mm < 2)   return '🌦️';
  if (prob < 80 || mm < 5)   return '🌧️';
  return '⛈️';
}

function windEmoji(speed) {
  if (speed < 8) return '🍃';
  if (speed < 20) return '🌬️';
  if (speed < 35) return '💨';
  return '🌪️';
}

function tempEmoji(temp) {
  if (temp <= 0) return '🌡️🔵';
  if (temp <= 8) return '🌡️🟦';
  if (temp <= 16) return '🌡️🟩';
  if (temp <= 24) return '🌡️🟨';
  if (temp <= 30) return '🌡️🟧';
  return '🌡️🔴';
}

function getRange(values) {
  const clean = values.filter(Number.isFinite);
  if (!clean.length) return 0;
  return Math.max(...clean) - Math.min(...clean);
}

function getReliabilityLevel(score) {
  if (score >= 75) {
    return { score, label: 'Forte', icon: '🟢', className: 'reliability-high' };
  }
  if (score >= 50) {
    return { score, label: 'Moyenne', icon: '🟡', className: 'reliability-medium' };
  }
  return { score, label: 'Faible', icon: '🔴', className: 'reliability-low' };
}

function getReliabilityFromRange(range, scale) {
  const disagreement = Math.min(range / scale, 1);
  const score = Math.max(0, Math.min(100, Math.round((1 - disagreement) * 100)));
  return getReliabilityLevel(score);
}

function getVariableReliability(hoursAtSameTime) {
  const cloudRange = getRange(hoursAtSameTime.map(h => h.cloud));
  const tempRange = getRange(hoursAtSameTime.map(h => h.temp));
  const windRange = getRange(hoursAtSameTime.map(h => h.wind));
  const rainProbRange = getRange(hoursAtSameTime.map(h => h.rain));
  const precipRange = getRange(hoursAtSameTime.map(h => h.precip));

  const precipDisagreement = Math.min(((rainProbRange / 100) + (precipRange / 5)) / 2, 1);
  const precipScore = Math.max(0, Math.min(100, Math.round((1 - precipDisagreement) * 100)));

  return {
    cloud: getReliabilityFromRange(cloudRange, 100),
    temp: getReliabilityFromRange(tempRange, 12),
    wind: getReliabilityFromRange(windRange, 40),
    precip: getReliabilityLevel(precipScore)
  };
}

function formatPercent(value, decimals = 2) {
  if (!Number.isFinite(value)) return '--';
  return `${value.toFixed(decimals)}%`;
}

function cloudBar(pct) {
  if (!Number.isFinite(pct)) {
    return `<div class="cell-stack" title="Couverture nuageuse indisponible"><span class="cell-icon">—</span><span class="cell-sub">--</span></div>`;
  }
  const pctText = formatPercent(pct, 2);
  return `<div class="cell-stack" title="${pctText} de couverture nuageuse"><span class="cell-icon">${cloudEmoji(pct)}</span><span class="cell-sub">${pctText}</span></div>`;
}

function render() {
  if (selectedForecastMode === FORECAST_MODES.multi && Array.isArray(multiWeatherData) && multiWeatherData.length) {
    renderMultiModel();
    return;
  }

  const d = weatherData;
  const cw = d.current_weather;
  const nowCode = WEATHER_CODES[cw.weathercode] || '—';
  const city = getSelectedCity();

  // Find index of today in daily array (past_days may shift it)
  const todayStr = new Date().toISOString().slice(0, 10);
  const todayIndex = d.daily.time.findIndex(t => t >= todayStr);
  const futureDays = d.daily.time.slice(todayIndex, todayIndex + 3);

  // Build tabs (only next 3 days)
  const tabs = futureDays.map((t, i) => {
    const absIndex = todayIndex + i;
    const label = i === 0 ? "Aujourd'hui" : i === 1 ? 'Demain' : formatDate(t).split(' ').slice(0,2).join(' ');
    return `<button class="day-tab ${absIndex === selectedDay ? 'active' : ''}" onclick="selectDay(${absIndex})">${label}</button>`;
  }).join('');

  // Hourly rows
  const hours = getHourlyForDay(selectedDay);
  const t = getThresholds();
  const criteriaLegend = currentActivity !== 'climbing'
    ? `<div class="criteria-legend"><strong>KO :</strong> N nuages · P% proba pluie · mm cumul pluie · V vent · T-/T+ température hors plage</div>`
    : '';
  const checkHeaderLabel = currentActivity === 'climbing' ? '✓' : 'OK / KO';
  const rows = hours.map(h => {
    const rainDecision = getRainDecision(h);
    const rainForDecision = rainDecision.value;
    const usesRainFallback = rainDecision.fallback;
    const hasRainProb = Number.isFinite(h.rain);
    const rainProb = hasRainProb ? h.rain : null;
    const hasPrecipMm = Number.isFinite(h.precip);
    const precipMm = hasPrecipMm ? h.precip : null;
    const hasCoreData = Number.isFinite(h.cloud) && Number.isFinite(h.temp) && Number.isFinite(h.wind) && hasPrecipMm;
    const good = isGoodHour(h);
    const moderate = !good && hasCoreData && Number.isFinite(rainForDecision) && h.cloud <= t.cloud * 1.3 && rainForDecision <= t.rain * 2 && h.wind <= t.wind * 1.2;
    const cls = good ? 'good' : moderate ? 'moderate' : '';
    const failedCriteria = [];
    if (!hasCoreData) {
      failedCriteria.push({
        tag: 'NA',
        title: 'Une ou plusieurs donnees sont indisponibles pour cet horaire/model.'
      });
    }
    if (!good && currentActivity !== 'climbing') {
      if (Number.isFinite(h.cloud) && h.cloud > t.cloud) {
        failedCriteria.push({
          tag: 'N',
          title: `Nuages trop élevés: ${Math.round(h.cloud)}% (seuil ≤${t.cloud}%)`
        });
      }
      if (Number.isFinite(h.rain) && h.rain > t.rain) {
        failedCriteria.push({
          tag: 'P%',
          title: `Probabilité de pluie trop élevée: ${Math.round(h.rain)}% (seuil ≤${t.rain}%)`
        });
      }
      if (t.precip != null && Number.isFinite(h.precip) && h.precip > t.precip) {
        failedCriteria.push({
          tag: 'mm',
          title: `Cumul pluie trop élevé: ${h.precip.toFixed(1)} mm/h (seuil ≤${t.precip} mm/h)`
        });
      }
      if (Number.isFinite(h.wind) && h.wind > t.wind) {
        failedCriteria.push({
          tag: 'V',
          title: `Vent trop fort: ${Math.round(h.wind)} km/h (seuil ≤${t.wind} km/h)`
        });
      }
      if (Number.isFinite(h.temp) && h.temp < t.tempMin) {
        failedCriteria.push({
          tag: 'T-',
          title: `Température trop basse: ${Math.round(h.temp)}°C (seuil ≥${t.tempMin}°C)`
        });
      }
      if (Number.isFinite(h.temp) && h.temp > t.tempMax) {
        failedCriteria.push({
          tag: 'T+',
          title: `Température trop élevée: ${Math.round(h.temp)}°C (seuil ≤${t.tempMax}°C)`
        });
      }
    }
    const uniqueTags = [...new Set(failedCriteria.map(item => item.tag))];
    const koLabel = uniqueTags.length ? uniqueTags.join('+') : 'NA';
    const koDetails = failedCriteria.map(item => item.title).join(' | ');
    const check = good
      ? '<span class="good-mark">✓</span>'
      : (failedCriteria.length
        ? `<span class="fail-tag fail-tag-single" title="${koDetails}">${koLabel}</span>`
        : '');
    const estimatedBadge = h.estimated ? '<span class="estimate-tag" title="Valeur estimee a partir de la prevision journaliere">estime</span>' : '';
    const fallbackBadge = '';
    const tempText = Number.isFinite(h.temp) ? `${Math.round(h.temp)}°C` : '--';
    const windText = Number.isFinite(h.wind) ? `${Math.round(h.wind)}km/h` : '--';
    const rainProbText = hasRainProb ? formatPercent(rainProb, 2) : '--';
    const rainMmText = hasPrecipMm ? `${precipMm.toFixed(1)} mm` : '--';
    const rainTitle = `Prob. ${rainProbText} · ${hasPrecipMm ? precipMm.toFixed(1) : '--'} mm/h`;
    return `<div class="forecast-row ${cls}">
      <span class="time-col">${formatTime(h.time)}${estimatedBadge}${fallbackBadge}</span>
      <span>${cloudBar(h.cloud)}</span>
      <span class="temp-col">${tempText}</span>
      <span class="wind-col">${windText}</span>
      <div class="cell-stack rain-col" title="${rainTitle}"><span class="cell-icon">${rainEmoji(Number.isFinite(rainForDecision) ? rainForDecision : 100, hasPrecipMm ? precipMm : 0)}</span><span class="cell-sub">${rainProbText}</span><span class="cell-sub">${rainMmText}</span></div>
      <span class="check-col">${check}</span>
    </div>`;
  }).join('') || `<div class="status" style="padding:24px">Aucune donnée disponible</div>`;

  // Best windows
  const windows = getBestWindows(hours);
  const windowsHtml = windows.length ? windows.map(w => {
    const sh = w.hours[w.start], eh = w.hours[w.end];
    const endTime = formatWindowEndTime(eh.time, 1);
    const windowHours = w.hours.slice(w.start, w.end + 1);
    const temps = windowHours.map(h => h.temp);
    const minT = Math.round(Math.min(...temps)), maxT = Math.round(Math.max(...temps));
    const avgCloud = Math.round(windowHours.reduce((a, h) => a + h.cloud, 0) / (w.end - w.start + 1));
    return `<div class="window-item">
      <span class="window-icon">🟢</span>
      <span class="window-main"><span class="window-time">${formatTime(sh.time)} - ${endTime}</span></span>
      <span class="window-info">${avgCloud}% nuages · ${minT}–${maxT}°C · vents &lt;${Math.round(Math.max(...w.hours.slice(w.start, w.end+1).map(h=>h.wind)))} km/h</span>
    </div>`;
  }).join('') : `<div class="no-windows">Aucune fenêtre idéale pour cette journée.</div>`;

  const climbingDrynessSummary = currentActivity === 'climbing'
    ? (() => {
        const dryHours = hours.filter(isDryRockHour);
        const sampleHour = hours[Math.max(0, Math.floor(hours.length / 2) - 1)] || hours[0];
        if (!sampleHour) return '';
        const m = getClimbingDrynessMetrics(sampleHour);
        const status = dryHours.length >= 2 ? 'Roche probablement seche' : 'Roche potentiellement humide';
        const ok = '🟢', ko = '🔴';
        const c24  = m.precip24 === 0 ? ok : ko;
        const c72  = m.precip72 < 2 ? ok : ko;
        const cRain = m.rainProb < 20 ? ok : ko;
        const cRawP = m.rawPrecip < 1.0 ? ok : ko;
        const cExpP = m.expectedPrecip < 0.1 ? ok : ko;
        const cDew  = m.dewGap > 3 ? ok : ko;
        const cRH   = m.humidity < 85 ? ok : ko;
        const cET0  = m.et0 > 0 ? ok : ko;
        const cWind = m.wind > 15 ? ok : ko;
        return `<div class="no-windows" style="font-style:normal;padding-top:10px;line-height:1.9">
          <strong>${status}</strong><br>
          ${c24} Pluie dernières 24h : <strong>${m.precip24.toFixed(1)} mm</strong> <small style="opacity:.7">(cible : 0 mm — la roche est encore gorgée si supérieur)</small><br>
          ${c72} Cumul 72h : <strong>${m.precip72.toFixed(1)} mm</strong> <small style="opacity:.7">(cible : &lt;2 mm — le calcaire retient l'eau par capillarité 2–3 jours)</small><br>
          ${cRain} Proba pluie prévue : <strong>${Math.round(m.rainProb)}%</strong> <small style="opacity:.7">(cible : &lt;20%)</small><br>
          ${cRawP} <abbr title="Quantité de pluie brute prévue pour cet intervalle, indépendamment de la probabilité. Même une faible probabilité (ex: 15%) associée à une quantité élevée (ex: 8 mm) reste dangereuse pour la roche.">Quantité pluie brute</abbr> : <strong>${m.rawPrecip.toFixed(1)} mm</strong> <small style="opacity:.7">(cible : &lt;1.0 mm — garde-fou absolu indépendant de la probabilité)</small><br>
          ${cExpP} <abbr title="Précipitation espérée = (probabilité / 100) × quantité. Combine les deux dimensions : une forte probabilité avec peu de mm OU une faible probabilité avec beaucoup de mm sont correctement pondérées.">Pluie espérée (prob × mm)</abbr> : <strong>${m.expectedPrecip.toFixed(2)} mm</strong> <small style="opacity:.7">(cible : &lt;0.10 mm — risque pondéré statistique)</small><br>
          ${cDew} <abbr title="Tair − Trosée : écart entre la température de l'air et le point de rosée. Si cet écart est faible (&lt;3°C) et l'air saturé, la vapeur d'eau se condense en surface de la roche, la rendant glissante sans aucune pluie.">Tair − Trosée</abbr> : <strong>${m.dewGap.toFixed(1)}°C</strong> <small style="opacity:.7">(cible : &gt;3°C — risque de « gras » par condensation en dessous)</small><br>
          ${cRH} <abbr title="RH = Humidité relative (Relative Humidity). Mesure la quantité de vapeur d'eau présente dans l'air en % de la saturation maximale possible à cette température. À 100%, l'air est saturé et la roche ne peut plus sécher.">Humidité relative (RH)</abbr> : <strong>${Math.round(m.humidity)}%</strong> <small style="opacity:.7">(cible : &lt;85%)</small><br>
          ${cET0} <abbr title="ET0 = Évapotranspiration de référence (FAO-56). Estime l'énergie disponible dans l'air pour évaporer l'eau (en mm/h). Si ET0 ≈ 0, les conditions météo ne permettent pas au calcaire de sécher : air calme, ciel couvert, humidité élevée.">Évapotranspiration ET0</abbr> : <strong>${m.et0.toFixed(2)} mm/h</strong> <small style="opacity:.7">(cible : &gt;0 — énergie disponible pour sécher la roche)</small><br>
          ${cWind} Vent : <strong>${Math.round(m.wind)} km/h</strong> <small style="opacity:.7">(cible : &gt;15 km/h — le vent accélère le séchage des parois exposées)</small>
        </div>`;
      })()
    : '';

  // Sunrise/sunset
  const srTime = formatTime(d.daily.sunrise[selectedDay]);
  const ssTime = formatTime(d.daily.sunset[selectedDay]);

  document.getElementById('app').innerHTML = `
    <div class="current-panel">
      <div class="current-temp">${Math.round(cw.temperature)}<sup>°</sup></div>
      <div class="current-details">
        <div class="current-condition">${nowCode}</div>
        <div class="current-meta">
          <span>💨 ${Math.round(cw.windspeed)} km/h</span>
          <span>📍 ${city.label}</span>
        </div>
      </div>
      <div class="sun-times">
        <div>🌅 <strong>${srTime}</strong></div>
        <div>🌇 <strong>${ssTime}</strong></div>
      </div>
    </div>

    <div class="activity-selector">
      ${Object.entries(ACTIVITIES).map(([key, a]) =>
        `<button class="activity-btn ${key === currentActivity ? 'active' : ''}"
          onclick="selectActivity('${key}')">${a.label}</button>`
      ).join('')}
    </div>

    <div class="day-tabs">${tabs}</div>

    <div class="forecast-panel">
      <div class="forecast-header">
        <span>Heure</span>
        <span>☁</span>
        <span>Temp.</span>
        <span>Vent</span>
        <span>🌧️</span>
        <span>${checkHeaderLabel}</span>
      </div>
      ${rows}
    </div>
    ${criteriaLegend}

    <div class="windows-panel">
      <div class="windows-title">🟢 Meilleures fenêtres — ${ACTIVITIES[currentActivity].label} · nuages &lt;${t.cloud}% · pluie &lt;${t.rain}% · vent &lt;${t.wind} km/h<br><small style="opacity:0.7;font-size:0.6rem">${t.tips}</small></div>
      ${windowsHtml}
      ${climbingDrynessSummary}
    </div>

    <div class="geo-panel">
      <div class="geo-top">
        <div class="geo-title">Localisation GPS</div>
        <div class="geo-coords">${formatCoord(city.lat, 'N', 'S')} · ${formatCoord(city.lon, 'E', 'O')}</div>
      </div>
      <iframe
        class="geo-map"
        title="Carte pays de ${city.name}"
        src="${getMapUrl(city)}"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </div>
  `;
}

function renderMultiModel() {
  const base = multiWeatherData[0].data;
  const city = getSelectedCity();
  const todayStr = new Date().toISOString().slice(0, 10);
  const todayIndex = base.daily.time.findIndex(t => t >= todayStr);
  const futureDays = base.daily.time.slice(todayIndex, todayIndex + 3);

  const tabs = futureDays.map((t, i) => {
    const absIndex = todayIndex + i;
    const label = i === 0 ? "Aujourd'hui" : i === 1 ? 'Demain' : formatDate(t).split(' ').slice(0, 2).join(' ');
    return `<button class="day-tab ${absIndex === selectedDay ? 'active' : ''}" onclick="selectDay(${absIndex})">${label}</button>`;
  }).join('');

  const perModelHours = multiWeatherData.map(entry => {
    const hours = getHourlyForDayFromData(entry.data, selectedDay);
    const byTime = new Map(hours.map(h => [h.time, h]));
    return { mode: entry.mode, label: entry.label, byTime };
  });

  const modelVisuals = {
    [FORECAST_MODES.icon]: { badge: 'ICON-EU', className: 'model-icon' },
    [FORECAST_MODES.arome]: { badge: 'meteo france', className: 'model-meteofrance' },
    [FORECAST_MODES.icon_d2]: { badge: 'ICON-D2', className: 'model-icond2' },
    [FORECAST_MODES.knmi]: { badge: 'KNMI', className: 'model-knmi' },
    [FORECAST_MODES.dmi]: { badge: 'DMI', className: 'model-dmi' },
    [FORECAST_MODES.rsukmo]: { badge: 'RS-UKMO', className: 'model-rsukmo' }
  };

  const baseHours = getHourlyForDayFromData(base, selectedDay);
  const timeSlots = baseHours.map(h => h.time);

  const hourBlocks = timeSlots.map(time => {
    const hourSamples = [];
    const cards = perModelHours.map(model => {
      const h = model.byTime.get(time);
      const visual = modelVisuals[model.mode] || { badge: model.label, className: 'model-icon' };
      if (!h) {
        return `<div class="multi-model-card unavailable">
          <div class="model-badge ${visual.className}">${visual.badge}</div>
          <div class="model-stat">Donnees indisponibles</div>
        </div>`;
      }

      hourSamples.push(h);

      const hasRainProb = Number.isFinite(h.rain);
      const rainDecision = getRainDecision(h);
      const hasPrecipMm = Number.isFinite(h.precip);
      const precipMm = hasPrecipMm ? h.precip : null;
      const rainProb = hasRainProb ? h.rain : 100;
      const rainForDecision = Number.isFinite(rainDecision.value) ? rainDecision.value : rainProb;
      const fallbackBadge = '';
      const hasCloud = Number.isFinite(h.cloud);
      const hasTemp = Number.isFinite(h.temp);
      const hasWind = Number.isFinite(h.wind);
      return `<div class="multi-model-card">
        <div class="model-badge ${visual.className}">${visual.badge}</div>
        <div class="model-stat">${hasCloud ? cloudEmoji(h.cloud) : '—'} ${hasCloud ? formatPercent(h.cloud, 2) : '--'}</div>
        <div class="model-stat">${hasTemp ? tempEmoji(h.temp) : '—'} ${hasTemp ? `${Math.round(h.temp)}°C` : '--'}</div>
        <div class="model-stat">${hasWind ? windEmoji(h.wind) : '—'} ${hasWind ? `${Math.round(h.wind)} km/h` : '--'}</div>
        <div class="model-stat">${rainEmoji(rainForDecision, hasPrecipMm ? precipMm : 0)} ${hasRainProb ? formatPercent(h.rain, 2) : '--'} · ${hasPrecipMm ? precipMm.toFixed(1) : '--'} mm${fallbackBadge}</div>
      </div>`;
    }).join('');

    const reliability = getVariableReliability(hourSamples);
    const reliabilityItems = [
      { key: 'Nuages', value: reliability.cloud },
      { key: 'Temperature', value: reliability.temp },
      { key: 'Vent', value: reliability.wind },
      { key: 'Precipitations', value: reliability.precip }
    ].map(item =>
      `<span class="reliability-badge ${item.value.className}" title="Fiabilite ${item.key}: ${item.value.score}/100">${item.value.icon} Fiabilite ${item.key}: ${item.value.score}/100</span>`
    ).join('');

    return `<div class="multi-hour-block">
      <div class="multi-hour-title">
        <span>${formatTime(time)}</span>
      </div>
      <div class="reliability-row">${reliabilityItems}</div>
      <div class="multi-model-grid">${cards}</div>
    </div>`;
  }).join('');

  document.getElementById('app').innerHTML = `
    <div class="current-panel">
      <div class="current-temp">${Math.round(base.current_weather.temperature)}<sup>°</sup></div>
      <div class="current-details">
        <div class="current-condition">Vue multimodel heure par heure</div>
        <div class="current-meta">
          <span>📍 ${city.label}</span>
          <span>🧠 ${multiWeatherData.length} modeles actifs</span>
        </div>
      </div>
      <div class="sun-times">
        <div>🌅 <strong>${formatTime(base.daily.sunrise[selectedDay])}</strong></div>
        <div>🌇 <strong>${formatTime(base.daily.sunset[selectedDay])}</strong></div>
      </div>
    </div>

    <div class="day-tabs">${tabs}</div>

    <div class="forecast-panel">
      <div class="multi-hour-list">${hourBlocks || '<div class="status" style="padding:24px">Aucune donnée disponible</div>'}</div>
    </div>
  `;
}

function selectActivity(key) {
  const wasClimbing = currentActivity === 'climbing';
  const isClimbing = key === 'climbing';

  if (!wasClimbing && isClimbing) {
    cityBeforeClimbing = { ...currentCity };
  }

  currentActivity = key;
  updateCitySuggestions();

  if (isClimbing) {
    const preferredSite = CLIMBING_SITES.saint_maximin_le_larris;
    if (findClimbingSite(currentCity.name) === null) {
      currentCity = {
        name: preferredSite.name,
        label: preferredSite.label,
        subtitle: preferredSite.subtitle,
        lat: preferredSite.lat,
        lon: preferredSite.lon,
        timezone: preferredSite.timezone,
        countryCode: preferredSite.countryCode || 'FR'
      };

      const cityInput = document.getElementById('cityInput');
      if (cityInput) cityInput.value = currentCity.name;
      updateCityLabels();
      loadWeather();
      return;
    }
  }

  if (wasClimbing && !isClimbing && cityBeforeClimbing) {
    currentCity = { ...cityBeforeClimbing };
    cityBeforeClimbing = null;
    const cityInput = document.getElementById('cityInput');
    if (cityInput) cityInput.value = currentCity.name;
    updateCityLabels();
    loadWeather();
    return;
  }

  render();
}

function selectDay(i) {
  selectedDay = i;
  render();
}

updateCitySuggestions();
updateCityLabels();
updateModelSourceLabel();
updateModelHelp();
loadWeather();
</script>
</body>
</html>
